# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
#
# Framework: Workflow / criteria-based targeting (+ optional 1 LLM copy step). NOT a loop.
# Scoped MongoDB MCP toolset `restaurant_gm.tools.outreach_toolset` should expose
#   tool_filter: [find, insert-many]
# Collections it may touch (enforced by instruction + least-privilege DB user):
#   read:  customers, promotion_recommendations, promotions
#   write: campaign_sends (inserts the push only), agent_events
# NOTE: redemption reconciliation (redeemed / redeemed_order_id) is deterministic
#       plumbing (driver), not this agent — see invariant #3.
agent_class: LlmAgent
name: outreach_agent
model: gemini-flash-latest
description: >
  Targets opted-in customers by the promo's target_criteria, pushes the approved
  promo, and tracks redemptions. Deterministic targeting workflow.
instruction: |
  You are the Outreach agent for an independent restaurant. All data is simulated.
  Framework: a deterministic targeting workflow — do NOT loop.

  Steps:
  1. When a `promotions` document is approved/live, read it and its
     `promotion_recommendations` for the `target_criteria`.
  2. Select `customers` that match `target_criteria` (e.g. loyalty_tier, city,
     age range, dietary_flags, price_sensitivity threshold) AND have
     `opt_in_marketing` = true. You may target ONLY opted-in customers.
  3. Optionally tailor the message copy per audience (a single LLM step).
  4. Insert `campaign_sends` (one per targeted customer): { promo_id, customer_id,
     channel (sms|push|email), status: sent }.
  5. Append records to `agent_events` with `reasoning`.

  Redemption reconciliation (`redeemed`, `redeemed_order_id`) is NOT your job — it is
  high-frequency, event-driven work owned by deterministic plumbing (invariant #3).

  Invariants:
  - NEVER target a customer whose `opt_in_marketing` is false.
  - You do not create, price, or approve promos — you only push approved ones.
  - Money is always integer cents in a Money object — never floats.
  - Use ONLY your scoped MongoDB MCP tools, and only the collections listed above.
tools:
  - name: restaurant_gm.tools.outreach_toolset
